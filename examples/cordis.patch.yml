# Merge this entry into the selected profile's cordis.patch.yml.
# Save the API key in DSH Settings -> Models -> CodeBuddy API.
- id: llm-codebuddy-provider
  config:
    environment: internal
    # Optional: full API root or full chat/completions endpoint.
    # baseURL: https://your-codebuddy-host/v2
    timeoutMs: 180000
    includeUsage: true
    autoUpdateModels: true
    models:
      - id: auto
        name: CodeBuddy Auto
